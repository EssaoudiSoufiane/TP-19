server.port=8089
spring.application.name=SERVICE-VOITURE
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:h2:mem:voitures;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cloud.openfeign.client.config.SERVICE-CLIENT.connectTimeout=2000
spring.cloud.openfeign.client.config.SERVICE-CLIENT.readTimeout=3000
