spring:
  cloud:
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: clients-statique
              uri: "${tp.client-uri:http://localhost:8088}"
              predicates:
                - Path=/clients,/clients/**,/client/**
            - id: voitures-statique
              uri: "${tp.voiture-uri:http://localhost:8089}"
              predicates:
                - Path=/voitures,/voitures/**,/voiture/**
eureka:
  client:
    enabled: false
